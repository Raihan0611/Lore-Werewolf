<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fun Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      width: 90%;
      max-width: 350px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    input {
      padding: 12px;
      width: 100%;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      margin-top: 10px;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 10px;
      background: #ff6f91;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #ff3d6e;
    }
    #result {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="box">
  <h3>Seberapa "Gay" kamu? 😭</h3>
  <input type="text" id="name" placeholder="Masukin nama kamu">
  <button onclick="cek()">Cek</button>
  <div id="result"></div>
</div>

<script>
function cek() {
  let name = document.getElementById("name").value;
  if (name === "") {
    document.getElementById("result").innerHTML = "Isi nama dulu woy 😭";
    return;
  }

  let persen = Math.floor(Math.random() * 101);
  document.getElementById("result").innerHTML =
    `${name} tingkat gay kamu: ${persen}% 🔥`;
}
</script>

</body>
</html>
